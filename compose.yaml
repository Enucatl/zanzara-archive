name: zanzara-archive

x-gpu: &gpu
  gpus: all
  restart: "no"
  profiles: [processing]
  volumes:
    - ${HF_HOME:-/home/user/.cache/huggingface}:/models/hf:ro
    - ${ZANZARA_MODEL_CACHE:-/home/user/.cache/zanzara-archive/models}:/models/zanzara:ro
    - ${SMOKE_AUDIO_HOST:-/home/user/.cache/zanzara-archive/models/eres2net/v1.0.3/examples/speaker1_a_en_16k.wav}:/smoke/audio.wav:ro
    - ${EVIDENCE_DIR:-.git/zanzara-evidence}/P1-01:/evidence
  healthcheck:
    test: [CMD, python, -c, "import json,urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2))"]
    interval: 5s
    timeout: 3s
    retries: 60

services:
  shared-base:
    image: zanzara-archive/shared-base:py314-cu130
    build:
      context: .
      dockerfile: services/shared-base/Dockerfile
    profiles: [processing]
    command: ["true"]

  parakeet:
    <<: *gpu
    image: zanzara-archive/parakeet:py314-shared
    # Loopback-only access is for the local process-stage CLI; the service is
    # not exposed beyond the host and remains internal to the Compose network.
    ports:
      - "127.0.0.1:${PARAKEET_PORT:-18080}:8080"
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/parakeet/Dockerfile
    environment:
      MODEL_PATH: /models/hf/hub/models--nvidia--parakeet-tdt-0.6b-v3/snapshots/541d1f99c6b0c3cd0b11a95167540bb8edefd82b
      MODEL_REVISION: 541d1f99c6b0c3cd0b11a95167540bb8edefd82b
      MODEL_SOURCE: nvidia/parakeet-tdt-0.6b-v3
      IMAGE_REF: zanzara-archive/parakeet:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/parakeet.json
  whisper:
    <<: *gpu
    image: zanzara-archive/whisper:py314-shared
    # P1R keeps its model smoke evidence separate from P1 service evidence.
    volumes:
      - ${HF_HOME:-/home/user/.cache/huggingface}:/models/hf:ro
      - ${ZANZARA_MODEL_CACHE:-/home/user/.cache/zanzara-archive/models}:/models/zanzara:ro
      - ${SMOKE_AUDIO_HOST:-/home/user/.cache/zanzara-archive/models/eres2net/v1.0.3/examples/speaker1_a_en_16k.wav}:/smoke/audio.wav:ro
      - ${EVIDENCE_DIR:-.git/zanzara-evidence}/P1R-05:/evidence
    ports:
      - "127.0.0.1:${WHISPER_PORT:-18082}:8080"
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/whisper/Dockerfile
    environment:
      MODEL_PATH: /models/hf/hub/models--openai--whisper-large-v3/snapshots/06f233fe06e710322aca913c1bc4249a0d71fce1
      MODEL_REVISION: 06f233fe06e710322aca913c1bc4249a0d71fce1
      MODEL_SOURCE: openai/whisper-large-v3
      IMAGE_REF: zanzara-archive/whisper:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/whisper.json
      SMOKE_AUDIO_LABEL: "260910-lazanzara.opus [0,10000) ms frozen Italian chunk"
      SMOKE_AUDIO_PROVENANCE: "real frozen corpus audio; private local excerpt; no synthesis"
  voxtral:
    <<: *gpu
    image: zanzara-archive/voxtral:py314-shared
    # P1R keeps Voxtral's model smoke evidence separate from P1 service evidence.
    volumes:
      - ${HF_HOME:-/home/user/.cache/huggingface}:/models/hf:ro
      - ${ZANZARA_MODEL_CACHE:-/home/user/.cache/zanzara-archive/models}:/models/zanzara:ro
      - ${SMOKE_AUDIO_HOST:-/home/user/.cache/zanzara-archive/models/eres2net/v1.0.3/examples/speaker1_a_en_16k.wav}:/smoke/audio.wav:ro
      - ${EVIDENCE_DIR:-.git/zanzara-evidence}/P1R-06:/evidence
    ports:
      - "127.0.0.1:${VOXTRAL_PORT:-18083}:8080"
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/voxtral/Dockerfile
    environment:
      MODEL_PATH: /models/hf/hub/models--mistralai--Voxtral-Mini-4B-Realtime-2602/snapshots/2769294da9567371363522aac9bbcfdd19447add
      MODEL_REVISION: 2769294da9567371363522aac9bbcfdd19447add
      MODEL_SOURCE: mistralai/Voxtral-Mini-4B-Realtime-2602
      IMAGE_REF: zanzara-archive/voxtral:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/voxtral.json
      SMOKE_AUDIO_LABEL: "260910-lazanzara.opus [0,10000) ms frozen Italian chunk"
      SMOKE_AUDIO_PROVENANCE: "real frozen corpus audio; private local excerpt; no synthesis"
  diarization:
    <<: *gpu
    image: zanzara-archive/diarization:py314-shared
    # The application sends only to this host loopback port for the local
    # full-episode processing command.
    ports:
      - "127.0.0.1:${DIARIZATION_PORT:-18081}:8080"
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/diarization/Dockerfile
    environment:
      MODEL_PATH: /models/hf/hub/models--pyannote--speaker-diarization-community-1/snapshots/3533c8cf8e369892e6b79ff1bf80f7b0286a54ee
      MODEL_REVISION: 3533c8cf8e369892e6b79ff1bf80f7b0286a54ee
      MODEL_SOURCE: pyannote/speaker-diarization-community-1
      IMAGE_REF: zanzara-archive/diarization:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/diarization.json
  resnet293:
    <<: *gpu
    image: zanzara-archive/resnet293:py314-shared
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/resnet293/Dockerfile
    environment:
      MODEL_PATH: /models/hf/hub/models--Wespeaker--wespeaker-voxceleb-resnet293-LM/snapshots/6e6bffe5bf3d772a1f143dc6dbfea58a0799ea83
      MODEL_REVISION: 6e6bffe5bf3d772a1f143dc6dbfea58a0799ea83
      MODEL_SOURCE: Wespeaker/wespeaker-voxceleb-resnet293-LM
      IMAGE_REF: zanzara-archive/resnet293:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/resnet293.json
  eres2net:
    <<: *gpu
    image: zanzara-archive/eres2net:py314-shared
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/eres2net/Dockerfile
    environment:
      MODEL_PATH: /models/zanzara/eres2net/v1.0.3
      MODEL_REVISION: v1.0.3
      MODEL_SOURCE: iic/speech_eres2net_sv_en_voxceleb_16k
      IMAGE_REF: zanzara-archive/eres2net:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/eres2net.json
  wavlm:
    <<: *gpu
    image: zanzara-archive/wavlm:py314-shared
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/wavlm/Dockerfile
    environment:
      MODEL_PATH: /models/zanzara/wavlm-large-verification/wavlm_large_finetune.pth
      MODEL_REVISION: 51f07e3b94d9e0262a6a675ef5a087be3dd09e8c62e9d886827f44f82fe7f94b
      MODEL_SOURCE: Microsoft UniSpeech released fine-tuned WavLM Large verification checkpoint and head
      IMAGE_REF: zanzara-archive/wavlm:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/wavlm.json
  text_embeddings:
    <<: *gpu
    image: zanzara-archive/text-embeddings:py314-shared
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/text-embeddings/Dockerfile
    environment:
      MODEL_PATH: /models/hf/hub/models--BAAI--bge-m3/snapshots/5617a9f61b028005a4858fdac845db406aefb181
      MODEL_REVISION: 5617a9f61b028005a4858fdac845db406aefb181
      MODEL_SOURCE: BAAI/bge-m3
      IMAGE_REF: zanzara-archive/text-embeddings:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/text_embeddings.json
  audioset_ast:
    <<: *gpu
    image: zanzara-archive/audioset-ast:py314-shared
    volumes:
      - ${HF_HOME:-/home/user/.cache/huggingface}:/models/hf:ro
      - ${ZANZARA_MODEL_CACHE:-/home/user/.cache/zanzara-archive/models}:/models/zanzara:ro
      - ${SMOKE_AST_AUDIO_HOST:-/export/scratch/archive/zanzara/260910-lazanzara.opus}:/smoke/audio.opus:ro
      - ${EVIDENCE_DIR:-.git/zanzara-evidence}/P1R-08A:/evidence
    ports:
      - "127.0.0.1:${AUDIOSET_AST_PORT:-18084}:8080"
    depends_on: [shared-base]
    build:
      context: .
      dockerfile: services/audioset-ast/Dockerfile
    environment:
      MODEL_PATH: /models/hf/hub/models--MIT--ast-finetuned-audioset-10-10-0.4593/snapshots/f826b80d28226b62986cc218e5cec390b1096902
      MODEL_REVISION: f826b80d28226b62986cc218e5cec390b1096902
      MODEL_SOURCE: MIT/ast-finetuned-audioset-10-10-0.4593
      LABEL_MAP_SHA256: a93d525511d77e8ecc933d09674b85099815bbbb417c228a4edd655e252fb9ff
      PREPROCESSING_SHA256: 286c62bc52da40ecd842fe10127b47eb4254ee126855bce6fc61c830344822bd
      IMAGE_REF: zanzara-archive/audioset-ast:py314-shared
      BASE_IMAGE_REF: zanzara-archive/shared-base:py314-cu130
      EVIDENCE_PATH: /evidence/audioset_ast.json
      SMOKE_AUDIO: /smoke/audio.opus
      SMOKE_AUDIO_LABEL: "260910-lazanzara.opus frozen real corpus audio"
      SMOKE_AUDIO_PROVENANCE: "real frozen corpus audio; private local excerpt; no synthesis"
  model-smoke:
    image: zanzara-archive/model-smoke:py314-shared
    build:
      context: .
      dockerfile: services/model-smoke/Dockerfile
    profiles: [processing]
    depends_on:
      parakeet: {condition: service_healthy}
      diarization: {condition: service_healthy}
      resnet293: {condition: service_healthy}
      eres2net: {condition: service_healthy}
      wavlm: {condition: service_healthy}
      text_embeddings: {condition: service_healthy}
      audioset_ast: {condition: service_healthy}
    environment:
      SMOKE_TIMEOUT_SECONDS: 180
