[project]
name = "resnet293-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "onnxruntime==1.24.3",
  "soundfile==0.13.1",
  "torch==2.14.0",
  "torchaudio==2.11.0",
  "transformers==5.17.0",
  "wespeaker @ git+https://github.com/wenet-e2e/wespeaker.git@dfa741957e5c11f477623b6e583d67d0af25ee88",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"
