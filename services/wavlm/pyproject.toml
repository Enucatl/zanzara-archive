[project]
name = "wavlm-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "soundfile==0.13.1",
  "torch==2.14.0",
  "torchaudio==2.11.0",
  "transformers==5.17.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"
